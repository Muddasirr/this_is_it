# CourtLens BoT-SORT (Ultralytics). GMC on; appearance via our OSNet post-merge
# (VISION_REID=1), not Ultralytics online ReID (needs separate ONNX asset).
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 45
match_thresh: 0.8
fuse_score: True
gmc_method: sparseOptFlow
proximity_thresh: 0.5
appearance_thresh: 0.75
with_reid: False
model: auto
