services:
  db:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: futsal
      POSTGRES_PASSWORD: futsal
      POSTGRES_DB: futsal
    # Host 5434 may already be bound — DB stays on the compose network.
    # ports:
    #   - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futsal -d futsal"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    # Host 6379 often already taken by a local Redis — keep Redis internal-only.
    # ports:
    #   - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO image pull may be blocked in some environments.
  # Default STORAGE_BACKEND=local writes to ./backend/data/videos (shared volume).
  # To use S3 later: set STORAGE_BACKEND=s3 and add a reachable MinIO/S3 endpoint.

  api:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://futsal:futsal@db:5432/futsal
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /data/videos
      API_PUBLIC_URL: http://localhost:8001
      JWT_SECRET: dev-change-me
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
      VISION_BACKEND: yolo
      YOLO_MODEL: yolov8m.pt
      VISION_DEVICE: cpu
      VISION_TARGET_FPS: "10"
      COURT_FORMAT: ${COURT_FORMAT:-5v5}  # 11v11 = football
      ALLOW_SINGLE_CAMERA: "true"
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
      - video_data:/data/videos
      - yolo_weights:/root/.cache/torch
      - ./data/eval/football_analysis_model/best.pt:/app/yolov5x_football.pt:ro
      - ./yolov8n.pt:/app/yolov8n.pt:ro
      - ./yolov8n_futsal.pt:/app/yolov8n_futsal.pt:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.workers.runner
    environment:
      DATABASE_URL: postgresql+psycopg://futsal:futsal@db:5432/futsal
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /data/videos
      API_PUBLIC_URL: http://localhost:8001
      JWT_SECRET: dev-change-me
      # kaggle = detect/track + futsal event spotter on a free Kaggle T4 (30 GPU-h/week), falls
      # back to local yolo on any failure. yolo = local CPU only. modal = paused 2026-10-25 (credits).
      VISION_BACKEND: ${VISION_BACKEND:-kaggle}
      # Learned event spotter: T-DEED fine-tuned on hand-labelled futsal, runs on the Kaggle GPU (the
      # CPU fallback uses the heuristics). Thresholds + 1 s NMS from the held-out 5:00–7:10 window:
      # pass F1 0.60; shots precision 0.67, recall 2/7 (EVAL.md).
      TDEED_REPO: /app/data/third_party/tdeed
      TDEED_WEIGHTS: /app/models/tdeed_futsal.pt
      TDEED_WEIGHTS_FOOTBALL: /app/models/tdeed_soccertrack.pt  # COURT_FORMAT=11v11
      TDEED_THRESHOLDS: '{"pass": 0.35, "shot": 0.5, "dribble": 0.3}'
      YOLO_MODEL: yolov8m.pt
      VISION_DEVICE: cpu
      VISION_TARGET_FPS: "10"
      VISION_MAX_FRAMES: "0"
      VISION_JERSEY_OCR: "1"
      COURT_FORMAT: ${COURT_FORMAT:-5v5}  # 11v11 = football
      ALLOW_SINGLE_CAMERA: "true"
    volumes:
      - ./backend:/app
      - video_data:/data/videos
      - yolo_weights:/root/.cache/torch
      - ./data/eval/football_analysis_model/best.pt:/app/yolov5x_football.pt:ro
      - ./yolov8n.pt:/app/yolov8n.pt:ro
      - ./yolov8n_futsal.pt:/app/yolov8n_futsal.pt:ro
      - ${HOME}/.modal.toml:/root/.modal.toml:ro  # Modal CLI token (modal token new)
      - ${HOME}/.kaggle:/root/.kaggle:ro  # Kaggle API credentials (VISION_BACKEND=kaggle)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://localhost:8001
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
  video_data:
  yolo_weights:
